<div class="container">
  <img src="logo.png" alt="Solstice Logo" style="width:120px; margin-bottom:20px;">
  <h1>Check-In Kiosk</h1>
  
  <input type="text" id="attendeeId" placeholder="Enter QR code / ID" />
  <br>
  <button onclick="checkIn()">Check In</button>
  <button onclick="startScanner()">Scan QR</button>
  
  <div id="status"></div>
  
  <!-- Approve button appears only after pending -->
  <button id="approveBtn" style="display:none;" onclick="approve()">Approve Print</button>
  
  <div id="preview"><video id="qr-video"></video></div>
</div>

<script>
  async function checkIn() {
    const id = document.getElementById('attendeeId').value;
    const statusDiv = document.getElementById('status');
    const approveBtn = document.getElementById('approveBtn');
    statusDiv.textContent = "Submitting...";
    approveBtn.style.display = "none";

    try {
      const res = await fetch(`/checkin/${id}`, { method: 'POST' });
      const data = await res.json();

      if (data.status === "pending") {
        statusDiv.innerHTML = `⏳ Pending for attendee <b>${id}</b>`;
        approveBtn.style.display = "inline-block";
      } else if (data.status === "duplicate") {
        statusDiv.innerHTML = "⚠️ Already checked in!";
      } else {
        statusDiv.innerHTML = "Error: " + data.message;
      }
    } catch (err) {
      statusDiv.textContent = "Error: " + err.message;
    }
  }

  async function approve() {
    const id = document.getElementById('attendeeId').value;
    const statusDiv = document.getElementById('status');
    try {
      const res = await fetch('/printer-callback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attendeeId: id, success: true })
      });
      const text = await res.text();
      statusDiv.innerHTML = `✅ Approved for attendee <b>${id}</b>`;
      document.getElementById('approveBtn').style.display = "none";
    } catch (err) {
      statusDiv.textContent = "Error approving: " + err.message;
    }
  }
</script>
