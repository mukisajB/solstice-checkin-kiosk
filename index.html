<!DOCTYPE html>
<html>
<head>
  <title>Solstice Check-In Kiosk</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #9acd32, #ffff66, #40e0d0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 400px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    input {
      padding: 10px;
      width: 80%;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 20px;
      background: #4facfe;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #00c6ff;
      box-shadow: 0 0 10px rgba(0,198,255,0.6);
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
      color: #444;
    }
    #preview {
      margin-top: 20px;
      width: 200px;
      height: 200px;
      border: 2px dashed #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video {
      width: 100%;
    }
    table {
      margin-top: 20px;
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Solstice Logo" style="width:120px; margin-bottom:20px;">
    <h1>Check-In Kiosk</h1>
    
    <input type="text" id="attendeeId" placeholder="Enter QR code / ID" />
    <br>
    <button onclick="checkIn()">Check In</button>
    <button onclick="startScanner()">Scan QR</button>
    
    <div id="status"></div>
    <button id="approveBtn" style="display:none;" onclick="approve()">Approve Print</button>
    
    <div id="preview"><video id="qr-video"></video></div>
    
    <table id="infoTable">
      <tr>
        <th>Attendee ID</th>
        <th>Status</th>
      </tr>
      <tr>
        <td id="infoId">-</td>
        <td id="infoStatus">-</td>
      </tr>
    </table>
  </div>

  <!-- QR Scanner library -->
  <script src="https://unpkg.com/qr-scanner/qr-scanner.min.js"></script>
  <script>
    async function checkIn() {
      const id = document.getElementById('attendeeId').value;
      const statusDiv = document.getElementById('status');
      const approveBtn = document.getElementById('approveBtn');
      statusDiv.textContent = "Submitting...";
      approveBtn.style.display = "none";

      try {
        const res = await fetch(`/checkin/${id}`, { method: 'POST' });
        const data = await res.json();

        document.getElementById('infoId').textContent = id;
        document.getElementById('infoStatus').textContent = data.status;

        if (data.status === "pending") {
          statusDiv.innerHTML = "⏳ <span style='color:orange'>Pending... waiting for printer callback</span>";
          approveBtn.style.display = "inline-block";
        } else if (data.status === "duplicate") {
          statusDiv.innerHTML = "⚠️ <span style='color:red'>Already checked in!</span>";
        } else if (data.status === "approved") {
          statusDiv.innerHTML = "✅ <span style='color:green'>Approved successfully!</span>";
        } else {
          statusDiv.innerHTML = "❌ Error: " + data.message;
        }
      } catch (err) {
        statusDiv.textContent = "Error: " + err.message;
      }
    }

    async function approve() {
      const id = document.getElementById('attendeeId').value;
      const statusDiv = document.getElementById('status');
      try {
        const res = await fetch('/printer-callback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ attendeeId: id, success: true })
        });
        const text = await res.text();
        statusDiv.innerHTML = `✅ <span style='color:green'>Approved for attendee <b>${id}</b></span>`;
        document.getElementById('approveBtn').style.display = "none";
        document.getElementById('infoStatus').textContent = "approved";
      } catch (err) {
        statusDiv.textContent = "Error approving: " + err.message;
      }
    }

    function startScanner() {
      const videoElem = document.getElementById('qr-video');
      const qrScanner = new QrScanner(videoElem, result => {
        document.getElementById('attendeeId').value = result;
        qrScanner.stop();
        checkIn();
      });
      qrScanner.start();
    }
  </script>
</body>
</html>
